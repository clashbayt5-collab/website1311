<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Норильск без сайта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: шапка со сводкой → плитки ниш → липкая панель фильтров → лента карточек компаний */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --ink: #13212c;
  --muted: #5b6b77;
  --line: #d5dee4;
  --accent: #0b6e78;
  --accent-soft: #dcefF0;
  --hot: #c2410c;  --hot-soft: #fde7dc;
  --warm: #9a6a06; --warm-soft: #f8edcf;
  --cold: #5b6b77; --cold-soft: #e7ecef;
  --done: #2f7d4b;
  --f-display: "Unbounded", "Onest", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e171d; --surface: #15222b; --ink: #e4ecf1; --muted: #93a4b0; --line: #26353f;
  --accent: #4fc1cb; --accent-soft: #143840;
  --hot: #ff8a57; --hot-soft: #3d2216; --warm: #e2b453; --warm-soft: #352a12;
  --cold: #93a4b0; --cold-soft: #1f2d36; --done: #6cc890; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e171d; --surface: #15222b; --ink: #e4ecf1; --muted: #93a4b0; --line: #26353f;
  --accent: #4fc1cb; --accent-soft: #143840;
  --hot: #ff8a57; --hot-soft: #3d2216; --warm: #e2b453; --warm-soft: #352a12;
  --cold: #93a4b0; --cold-soft: #1f2d36; --done: #6cc890; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { padding-block: 28px 18px; display: grid; gap: 14px; }
.eyebrow { font: 600 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(26px, 4.4vw, 40px)/1.1 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 em { font-style: normal; color: var(--accent); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: 14px; }
.stats b { font: 600 15px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }

.niches { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; padding-block: 6px 18px; }
.niche { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 12px 10px; cursor: pointer; display: grid; gap: 6px; transition: border-color .15s, background .15s; }
.niche:hover { border-color: var(--accent); }
.niche[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.niche[aria-pressed="true"] .n-meta { color: var(--surface); opacity: .85; }
.n-name { font-weight: 600; font-size: 14px; line-height: 1.25; }
.n-meta { display: flex; gap: 10px; font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.n-meta .h { color: var(--hot); font-weight: 600; }
.niche[aria-pressed="true"] .n-meta .h { color: var(--surface); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px; }
.bar .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar input[type=search] { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.bar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button span { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button[aria-pressed="true"] span { color: var(--bg); opacity: .75; }
.seg button[data-p="A"][aria-pressed="true"] { background: var(--hot); color: var(--surface); }
.seg button[data-p="A"][aria-pressed="true"] span { color: var(--surface); }
.grp { display: flex; align-items: baseline; gap: 10px; padding-top: 10px; font: 600 13px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.grp::after { content: ""; flex: 1; border-bottom: 1px solid var(--line); }
.grp.A { color: var(--hot); } .grp.B { color: var(--warm); }
.count { font: 13px var(--f-mono); color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

.pitch { margin-block: 16px 4px; padding: 14px 16px; border-radius: 10px; background: var(--accent-soft); display: grid; gap: 4px; }
.pitch h2 { margin: 0; font: 600 18px/1.3 var(--f-display); }
.pitch p { margin: 0; max-width: 75ch; }

.list { display: grid; gap: 10px; padding-block: 14px 40px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
.card.done { opacity: .55; }
.c-main { min-width: 0; display: grid; gap: 5px; }
.c-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.c-name { font-weight: 700; font-size: 16.5px; line-height: 1.3; }
.pill { font: 600 11.5px/1 var(--f-mono); padding: 4px 7px; border-radius: 5px; letter-spacing: .03em; white-space: nowrap; }
.pill.A { background: var(--hot-soft); color: var(--hot); }
.pill.B { background: var(--warm-soft); color: var(--warm); }
.pill.C { background: var(--cold-soft); color: var(--cold); }
.c-cats { color: var(--muted); font-size: 13.5px; }
.c-line { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
.c-line .rt { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.phones { display: flex; flex-wrap: wrap; gap: 6px; }
.phone { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 7px; padding: 3px 4px 3px 9px; font: 13px var(--f-mono); user-select: all; }
.phone button { border: 0; background: var(--cold-soft); border-radius: 5px; padding: 2px 7px; cursor: pointer; font: 12px var(--f-body); user-select: none; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.lk { text-decoration: none; font-size: 13px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.lk:hover { border-color: var(--accent); color: var(--accent); }
.lk.map { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; }
.lk.map:hover { filter: brightness(1.1); color: var(--surface); }
.why { font-size: 13.5px; color: var(--muted); max-width: 80ch; }
.c-side { display: grid; justify-items: end; align-content: start; gap: 8px; }
.score { font: 700 22px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.score small { font: 11px var(--f-body); color: var(--muted); display: block; text-align: right; margin-top: 2px; }
.mark { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.mark input { accent-color: var(--done); width: 16px; height: 16px; }
.more { justify-self: center; padding: 10px 22px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; font-weight: 600; }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
footer { padding-block: 10px 30px; color: var(--muted); font-size: 13px; }

/* сценарий звонка по нише */
.me { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.me input { width: 180px; max-width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.script { margin-block: 16px 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.s-top { padding: 16px 18px 14px; display: grid; gap: 10px; background: var(--accent-soft); }
.s-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.s-head h2 { margin: 0; font: 600 19px/1.3 var(--f-display); text-wrap: balance; }
.s-goal { font: 600 12px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.s-short { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; max-width: 95ch; }
.s-short li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; line-height: 1.45; }
.s-short b { font: 600 12px/1.9 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.ph { background: var(--warm-soft); color: var(--warm); border-radius: 4px; padding: 0 4px; font-weight: 600; }
.s-rev { padding: 12px 18px; border-top: 1px solid var(--line); display: grid; gap: 8px; font-size: 14px; }
.s-rev h3, .s-body h3 { margin: 0; font: 600 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pains { display: flex; flex-wrap: wrap; gap: 6px; }
.pain { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--hot-soft); color: var(--hot); white-space: nowrap; }
.pain.soft { background: var(--cold-soft); color: var(--ink); }
.quote { margin: 0; padding: 6px 0 6px 12px; border-left: 3px solid var(--line); color: var(--muted); font-size: 13.5px; max-width: 90ch; }
.quote b { color: var(--ink); font-weight: 600; }
details.full > summary, details.prep > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; font-weight: 600; user-select: none; }
details.full > summary::-webkit-details-marker, details.prep > summary::-webkit-details-marker { display: none; }
details.full > summary::before, details.prep > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; margin-right: 2px; }
details[open].full > summary::before, details[open].prep > summary::before { transform: rotate(45deg); }
details.full { border-top: 1px solid var(--line); }
details.full > summary { padding: 13px 18px; color: var(--accent); }
.s-body { padding: 4px 18px 20px; display: grid; gap: 18px; max-width: 100ch; }
.s-body section { display: grid; gap: 8px; }
.s-body p { margin: 0; }
.say { margin: 0; padding: 10px 14px; border-radius: 8px; background: var(--bg); line-height: 1.55; }
.say::before { content: "Вы: "; font-weight: 700; color: var(--accent); }
.s-body ol, .s-body ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.obj { display: grid; gap: 4px; padding: 10px 14px; border-radius: 8px; background: var(--bg); }
.obj b { color: var(--hot); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.copybtn { justify-self: start; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
details.prep { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }
details.prep > summary { color: var(--accent); font-size: 14px; }
.prep-body { display: grid; gap: 10px; padding-top: 10px; font-size: 14px; max-width: 95ch; }
.prep-body h4 { margin: 0; font: 600 11.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.msg { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--bg); white-space: pre-wrap; font-size: 13.5px; }

.step { display: grid; gap: 8px; }
.step h3 { display: flex; align-items: center; gap: 10px; }
.num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--surface); font: 700 12px var(--f-mono); }
.goal { margin: 0; color: var(--muted); font-size: 14px; }
.step h4 { margin: 4px 0 0; font: 600 11.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tips { color: var(--muted); font-size: 13.5px; }
.react { display: grid; gap: 6px; }
.react div { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; padding: 8px 12px; border-radius: 8px; background: var(--bg); font-size: 14px; }
.react div span:first-child { font-weight: 600; }
.calc { display: grid; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.calc-in { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.calc-in label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.calc-in input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); font: 600 15px var(--f-mono); font-variant-numeric: tabular-nums; min-width: 0; }
.calc-hint { margin: 0; font-size: 12.5px; color: var(--muted); }
.calc-nums { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--muted); }
.calc-nums b { display: block; font: 700 18px var(--f-mono); color: var(--hot); font-variant-numeric: tabular-nums; }
.calc-nums span:nth-child(n+3) b { color: var(--done); }
.calc-out { display: grid; gap: 8px; }

.niche.special { border-style: dashed; }
.niche.special.hot .n-name { color: var(--hot); }
.niche.special.new .n-name { color: var(--accent); }
.niche.special[aria-pressed="true"] .n-name { color: var(--surface); }
.niche.special.hot[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); }
.pill.new { background: var(--accent-soft); color: var(--accent); }
.pill.hotp { background: var(--hot); color: var(--surface); }
.sig { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.sig span { padding: 2px 8px; border-radius: 999px; background: var(--hot-soft); color: var(--hot); }
details.noes { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }
details.noes > summary { cursor: pointer; font-weight: 600; color: var(--hot); font-size: 14px; }
.noes-body { display: grid; gap: 6px; padding-top: 8px; }

.boss { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.boss h4 { margin: 0; font: 600 11.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.b-row { display: grid; gap: 6px; font-size: 14px; }
.b-row.ok b { color: var(--done); }
.b-ph { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.b-ph small { color: var(--muted); font-size: 12.5px; }
.b-links { display: flex; flex-wrap: wrap; gap: 6px; }
.msg-lk { white-space: normal; text-align: left; display: inline-flex; flex-direction: column; gap: 0; line-height: 1.25; padding: 5px 12px; border-color: var(--accent); }
.msg-lk small { color: var(--muted); font-size: 11.5px; }
.msg-lk.best { background: var(--accent-soft); font-weight: 600; }
.msg-lk.weak { border-color: var(--line); opacity: .75; }
.pill.chat { background: var(--accent-soft); color: var(--accent); }
details.b-msg > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13.5px; }
details.b-msg[open] { display: grid; gap: 8px; }

.ftoggle { display: none; }
[hidden] { display: none !important; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: min(92vw, 420px); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: 0 6px 20px rgb(0 0 0 / .3); text-align: center; }
.fx { display: contents; }
.tel { color: inherit; text-decoration: none; }
.totop { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 700 20px var(--f-body); box-shadow: 0 4px 14px rgb(0 0 0 / .25); cursor: pointer; }

@media (max-width: 640px) {
  body { font-size: 15px; }
  input, select, textarea { font-size: 16px !important; }
  header.top { padding-block: 18px 12px; gap: 10px; }
  h1 { font-size: 26px; }
  .stats { gap: 4px 14px; font-size: 13px; }
  .me { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .me span { grid-column: 1 / -1; order: -2; }
  .me input { width: 100%; }
  .me #meStudio { grid-column: 1 / -1; order: -1; }
  .niches { display: flex; overflow-x: auto; gap: 6px; padding-block: 4px 12px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); scroll-snap-type: x proximity; scrollbar-width: none; }
  .niches::-webkit-scrollbar { display: none; }
  .niche { flex: 0 0 auto; min-width: 128px; max-width: 170px; padding: 8px 10px; scroll-snap-align: start; gap: 3px; }
  .n-name { font-size: 13.5px; }
  .n-meta { font-size: 11px; gap: 6px; }
  .bar { padding-block: 8px; }
  .bar .row { flex-wrap: wrap; }
  .bar input[type=search] { flex: 1 1 0; }
  .ftoggle { display: inline-block; flex: 0 0 auto; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 600; cursor: pointer; }
  .bar.open .ftoggle { background: var(--ink); color: var(--bg); }
  .fx { display: none; }
  .bar.open .fx { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; max-height: 60vh; overflow-y: auto; }
  .bar.open .fx select { flex: 1 1 140px; }
  .seg { width: 100%; }
  .seg { flex-wrap: nowrap; }
  .seg button { flex: 1 1 0; padding: 9px 2px; font-size: 12.5px; }
  .bar.open .fx select { flex: 1 1 0; min-width: 0; }
  .chip { padding: 9px 12px; }
  .count { margin-left: 0; }
  .card { grid-template-columns: minmax(0, 1fr); padding: 12px; gap: 6px; }
  .c-name { font-size: 16px; }
  .phone { padding: 4px 4px 4px 10px; font-size: 14px; }
  .phone button { padding: 6px 10px; }
  .lk { padding: 7px 12px; }
  .boss { padding: 10px; }
  .b-ph { gap: 2px 8px; }
  .script { margin-block: 12px 4px; }
  .s-top, .s-rev, details.full > summary { padding-inline: 14px; }
  .s-body { padding-inline: 14px; }
  .calc-in { grid-template-columns: 1fr 1fr; }
  .calc-in label:last-child { grid-column: 1 / -1; }
  .copybtn { padding: 9px 14px; }
  .s-short li { grid-template-columns: 1fr; gap: 0; }
  .react div { grid-template-columns: 1fr; gap: 2px; }
  .card { grid-template-columns: 1fr; }
  .c-side { grid-auto-flow: column; justify-content: space-between; justify-items: start; align-items: center; order: -1; }
  .score small { display: inline; margin-left: 4px; }
  .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Норильск · Талнах · Кайеркан · 2ГИС + Яндекс.Карты</div>
    <h1>Компании <em>без сайта</em></h1>
    <div class="stats" id="stats"></div>
    <div class="me">
      <span>Для сценариев:</span>
      <input id="meName" placeholder="Ваше имя" aria-label="Ваше имя">
      <input id="meStudio" placeholder="Название вашей студии" aria-label="Название студии">
      <input id="mePrice" type="number" min="0" placeholder="Цена сайта, ₽" aria-label="Цена сайта">
    </div>
  </header>
  <nav class="niches" id="niches" aria-label="Ниши"></nav>
</div>

<div class="bar">
  <div class="wrap row">
    <input type="search" id="q" placeholder="Поиск: название, улица, телефон, услуга" aria-label="Поиск">
    <button type="button" class="ftoggle" id="fToggle" aria-expanded="false">Фильтры</button>
    <div class="fx" id="fx">
    <select id="district" aria-label="Район">
      <option value="">Все районы</option>
      <option>Норильск (центр)</option><option>Талнах</option><option>Кайеркан</option>
    </select>
    <select id="sort" aria-label="Сортировка">
      <option value="score">По потенциалу</option>
      <option value="reviews">По отзывам</option>
      <option value="name">По названию</option>
    </select>
    <div class="seg" id="prio" role="group" aria-label="Приоритет">
      <button type="button" data-p="" aria-pressed="true">Все <span></span></button>
      <button type="button" data-p="A" aria-pressed="false">Горячие <span></span></button>
      <button type="button" data-p="B" aria-pressed="false">Тёплые <span></span></button>
      <button type="button" data-p="C" aria-pressed="false">Холодные <span></span></button>
    </div>
    <button class="chip" id="onlyChat" aria-pressed="false">Можно написать в TG/MAX</button>
    <button class="chip" id="hideDone" aria-pressed="false">Скрыть отмеченные</button>
    <span class="count" id="count"></span>
    </div>
  </div>
</div>
<button type="button" class="totop" id="toTop" aria-label="Наверх" hidden>↑</button>

<main class="wrap">
  <section class="script" id="script"></section>
  <div class="list" id="list"></div>
</main>
<footer class="wrap" id="foot"></footer>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const SLUG = {"Цветы":"flowers","Автосервис":"auto","Стоматология":"dental","Салоны красоты":"beauty","Доставка и еда":"food",
    "Ремонт и стройка":"repair","Бытовые услуги":"services","Медицина и здоровье":"medical","Обучение и дети":"kids",
    "Праздники и фото":"events","Гостиницы и досуг":"leisure","Деловые услуги":"business","__hot":"hot","__new":"new"};
  const BY_SLUG = Object.fromEntries(Object.entries(SLUG).map(([k, v]) => [v, k]));
  const leads = D.leads.map((r, i) => ({ ...r, i, p: (r.prio || 'C')[0],
    hay: [r.name, r.addr, r.cats, r.phones, r.district].join(' ').toLowerCase() }));
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const store = {
    get() { try { return JSON.parse(localStorage.getItem('done') || '{}'); } catch (e) { return {}; } },
    set(v) { try { localStorage.setItem('done', JSON.stringify(v)); } catch (e) {} }
  };
  let done = store.get();
  const key = r => (r.link2gis || r.linkya || r.name);

  const PAGE = 150;
  const state = { niche: '', q: '', district: '', sort: 'score', prio: '', hideDone: false, shown: PAGE };
  const PL = { A: 'A · горячий', B: 'B · тёплый', C: 'C · холодный' };

  // сводка
  const cnt = p => leads.filter(r => r.p === p).length;
  $('stats').innerHTML = `<span><b>${leads.length}</b> компаний без сайта</span>
    <span><b>${cnt('A')}</b> горячих</span><span><b>${cnt('B')}</b> тёплых</span>
    <span>проверено <b>${D.checked}</b> карточек</span>`;

  // плитки ниш
  function renderNiches() {
    const all = ['', '__hot', '__new'].concat(D.order.filter(n => leads.some(r => r.niche === n)));
    $('niches').innerHTML = all.map(n => {
      if (SPECIAL[n]) {
        const sub = SPECIAL[n].list();
        const meta = n === '__hot' ? `${sub.length} шт. · звонить первыми` : `${sub.length} шт. · ${sub.filter(r => r.nw.opening).length} скоро откроются`;
        return `<button class="niche special ${n.slice(2)}" data-n="${n}" aria-pressed="${state.niche === n}">
          <span class="n-name">${SPECIAL[n].name}</span><span class="n-meta"><span>${meta}</span></span></button>`;
      }
      const sub = n ? leads.filter(r => r.niche === n) : leads;
      const hot = sub.filter(r => r.p === 'A').length;
      return `<button class="niche" data-n="${esc(n)}" aria-pressed="${state.niche === n}">
        <span class="n-name">${n ? esc(n) : 'Все ниши'}</span>
        <span class="n-meta"><span>${sub.length} шт.</span><span class="h">${hot} горяч.</span></span></button>`;
    }).join('');
  }
  $('niches').addEventListener('click', e => {
    const b = e.target.closest('.niche'); if (!b) return;
    const n = b.dataset.n;
    location.hash = n ? SLUG[n] : '';
    if (!n) setNiche('');
  });
  function setNiche(n) {
    state.niche = n; state.shown = PAGE; renderNiches(); renderScript(); render();
    const act = document.querySelector('.niche[aria-pressed="true"]');
    if (act && window.innerWidth <= 640) act.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  // ---------- сценарии звонков ----------
  const S = D.scripts, C = S.common;
  const PAIN = {
    call:  ['Не дозвониться',        'онлайн-запись и заявка 24/7 снимут нагрузку с телефона'],
    price: ['Вопросы к ценам',       'прайс на сайте: клиент знает цену до визита'],
    book:  ['Запись и ожидание',     'онлайн-запись с выбором свободного времени'],
    info:  ['График и как найти',    'график, схема проезда и фото входа на сайте'],
    menu:  ['Меню и наличие',        'актуальный каталог или меню с наличием'],
    deliv: ['Доставка и заказы',     'онлайн-заказ со временем доставки и статусом'],
    photo: ['Ожидание и результат',  'портфолио реальных работ, чтобы ожидания совпадали']
  };
  // ---------- готовность купить и новые компании ----------
  const SOC_K = ['VK', 'Telegram', 'Instagram', 'MAX', 'OK', 'Viber', 'YouTube', 'TikTok', 'Дзен', 'RuTube', 'Facebook'];
  const PAY_K = /Яндекс Еда|Delivery|Flowwow|Chibbis|Booking|Суточно|Ostrovok|101Hotels|Твил|Профи|Яндекс Услуги|DIKIDI|YCLIENTS|Sonline|Arnica|EasyWeek|Beautybox/;
  const fmtDate = d => (d || '').split('-').reverse().join('.');
  const nicheCount = {}; leads.forEach(r => nicheCount[r.niche] = (nicheCount[r.niche] || 0) + 1);
  const share = n => { const s = (D.site_by_niche || {})[n] || 0; return Math.round(100 * s / ((s + (nicheCount[n] || 0)) || 1)); };
  const HOT_MIN = 8;
  leads.forEach(r => {
    const sig = []; let rs = 0;
    const keys = Object.keys(r.linkmap || {}), rv = r.reviews || 0;
    if (rv >= 300) { rs += 3; sig.push(`большой поток: ${rv} отзывов`); }
    else if (rv >= 100) { rs += 2; sig.push(`активный спрос: ${rv} отзывов`); }
    else if (rv >= 40) { rs += 1; sig.push(`${rv} отзывов`); }
    if ((r.rating || 0) >= 4.7 && rv >= 20) { rs += 1; sig.push(`рейтинг ${Number(r.rating).toFixed(1)}`); }
    if ((r.branches || 1) > 1) { rs += 2; sig.push(`${r.branches} точки — растут`); }
    const soc = keys.filter(k => SOC_K.includes(k)), pay = keys.filter(k => PAY_K.test(k));
    const land = keys.filter(k => /Taplink|Hipolink|Linktree|mssg|QR-меню/.test(k));
    if (soc.length >= 2 || land.length) { rs += 2; sig.push(`уже вкладываются в маркетинг: ${soc.concat(land).join(', ')}`); }
    else if (soc.length) { rs += 1; sig.push(`ведут ${soc[0]}`); }
    if (pay.length) { rs += 2; sig.push(`платят площадкам: ${pay.join(', ')}`); }
    const pains = r.rv && r.rv.p ? Object.keys(r.rv.p) : [];
    if (pains.length) { rs += 2; sig.push(`жалобы в отзывах: ${pains.map(c => PAIN[c][0].toLowerCase()).join(', ')}`); }
    const sh = share(r.niche); if (sh >= 30) { rs += 1; sig.push(`${sh}% конкурентов в нише уже с сайтом`); }
    if (r.nw) { rs += 2; sig.push(r.nw.opening ? `открывается ${fmtDate(r.nw.opening)}` : 'новая компания'); }
    r.rs = rs; r.sig = sig; r.hot = rs >= HOT_MIN && !!r.phones;
  });
  const SPECIAL = {
    __hot: { name: 'Готовы сейчас', list: () => leads.filter(r => r.hot) },
    __new: { name: 'Новые компании', list: () => leads.filter(r => r.nw) }
  };
  const inView = (x, n) => !n || (n === '__hot' ? x.hot : n === '__new' ? !!x.nw : x.niche === n);
  const me = { name: '', studio: '', price: '' };
  const ME = { meName: 'name', meStudio: 'studio', mePrice: 'price' };
  try { for (const id in ME) me[ME[id]] = localStorage.getItem(id) || ''; } catch (e) {}
  for (const id in ME) $(id).value = me[ME[id]];
  Object.keys(ME).forEach(id => $(id).addEventListener('input', e => {
    me[ME[id]] = e.target.value.trim();
    try { localStorage.setItem(id, e.target.value.trim()); } catch (err) {}
    renderScript(); render();
  }));
  const shortName = n => (n || '').split(',')[0].trim();
  // подставляет данные; html=true — подсвечивает незаполненное
  function fill(t, r, niche, html) {
    const ns = S.niches[niche] || {};
    const soc = r ? Object.keys(r.linkmap || {}).filter(k => !/номер|2ГИС|Яндекс/.test(k)).slice(0, 3).join(', ') : '';
    const v = {
      name: r ? shortName(r.name) : '', reviews: r && r.reviews ? r.reviews : '', rating: r && r.rating ? Number(r.rating).toFixed(1) : '',
      social: soc || (r ? 'телефон' : ''), manager: me.name, studio: me.studio,
      niche_lc: (niche || 'вашей сферы').toLowerCase(), payback: ns.payback || 'нескольких клиентов', query: ns.query || 'услуги'
    };
    const label = { name: 'название', reviews: 'N', rating: 'рейтинг', social: 'соцсети', manager: 'ваше имя', studio: 'студия' };
    let s = html ? esc(t) : t;
    s = s.replace(/\{(\w+)\}/g, (m, k) => v[k] !== undefined && v[k] !== '' ? (html ? esc(v[k]) : v[k])
      : (html ? `<span class="ph">${label[k] || k}</span>` : `[${label[k] || k}]`));
    if (html) s = s.replace(/\[([^\]]+)\]/g, '<span class="ph">$1</span>');
    return s;
  }
  // боли из отзывов по нише
  function nichePains(niche) {
    const sub = leads.filter(r => (!niche || r.niche === niche) && r.rv);
    const agg = {}; let bad = 0, total = 0; const used = new Set();
    sub.sort((a, b) => (b.reviews || 0) - (a.reviews || 0)).forEach(r => { total += r.rv.n || 0; bad += r.rv.bad || 0;
      Object.entries(r.rv.p || {}).forEach(([c, x]) => { (agg[c] = agg[c] || { firms: 0, neg: 0, q: [] }); agg[c].firms++; agg[c].neg += x[1];
        const nm = shortName(r.name);
        if (x[3] && x[3].length > 12 && !used.has(nm) && agg[c].q.length < 1) { agg[c].q.push([nm, x[3]]); used.add(nm); } }); });
    return { sub: sub.length, total, bad, agg: Object.entries(agg).sort((a, b) => b[1].firms - a[1].firms) };
  }
  // ---------- калькулятор потерь ----------
  const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
  function calcHtml(niche, who) {
    const c = (S.niches[niche] || {}).calc || { check: 3000, lost: 10, unit: 'клиентов', hint: '' };
    return `<div class="calc" data-calc="${esc(niche)}" data-who="${esc(who || '')}">
      <div class="calc-in">
        <label>Теряет ${esc(c.unit)} в месяц<input type="number" min="0" inputmode="numeric" data-k="lost" value="${c.lost}"></label>
        <label>Средний чек, ₽<input type="number" min="0" inputmode="numeric" data-k="check" value="${c.check}"></label>
        <label>Цена сайта, ₽<input type="number" min="0" inputmode="numeric" data-k="price" value="${esc(me.price)}" placeholder="ваша цена"></label>
      </div>
      <p class="calc-hint">${esc(c.hint)}. Значения примерные — замените цифрами, которые назвал клиент.</p>
      <div class="calc-out"></div>
    </div>`;
  }
  function calcUpdate(box) {
    const g = k => Math.max(0, Number(box.querySelector(`[data-k="${k}"]`).value) || 0);
    const lost = g('lost'), check = g('check'), price = g('price');
    const c = (S.niches[box.dataset.calc] || {}).calc || { unit: 'клиентов' };
    const month = lost * check, year = month * 12;
    let html = `<div class="calc-nums"><span><b>${rub(month)}</b> теряет в месяц</span><span><b>${rub(year)}</b> в год</span>`;
    let say = `Давайте прикинем. Вы сказали, что в месяц уходит примерно ${lost} ${c.unit}, средний чек около ${rub(check)}. Получается, мимо проходит примерно ${rub(month)} в месяц — это ${rub(year)} в год.`;
    if (price && check && month) {
      const need = Math.ceil(price / check), third = price / (month / 3);
      const term = third <= 1 ? 'меньше чем за месяц' : `примерно за ${Math.ceil(third)} мес`;
      html += `<span><b>${need}</b> клиентов окупают сайт</span><span><b>${third <= 1 ? '< 1 мес.' : Math.ceil(third) + ' мес.'}</b> окупаемость</span>`;
      say += ` Сайт стоит ${rub(price)}: чтобы он окупился, нужно вернуть всего ${need} ${c.unit}. Даже если сайт вернёт только треть потерянных, он окупится ${term}.`;
    } else if (!price) {
      say += ' [Впишите цену сайта, чтобы посчитать окупаемость.]';
    }
    html += `</div><p class="say">${esc(say).replace(/\[([^\]]+)\]/g, '<span class="ph">$1</span>')}</p>`;
    box.querySelector('.calc-out').innerHTML = html;
  }
  document.addEventListener('input', e => { const box = e.target.closest('.calc'); if (box) calcUpdate(box); });
  document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.prep') && e.target.open) initCalcs(e.target); }, true);
  const initCalcs = root => root.querySelectorAll('.calc').forEach(calcUpdate);

  // ---------- сценарий по нише ----------
  const noesHtml = (list, n, r, open) => list && list.length ? `<details class="noes"${open ? ' open' : ''}><summary>Если отвечает «нет» · ${list.length}</summary><div class="noes-body">${list.map(([q, a]) => `<div class="obj"><b>${esc(q)}</b><span>${fill(a, r, n, true)}</span></div>`).join('')}</div></details>` : '';
  function stepHtml(st, k, n, extra) {
    return `<section class="step"><h3><span class="num">${k + 1}</span>${esc(st.title)}</h3>
      <p class="goal">${esc(st.goal)}</p>
      ${st.say ? `<p class="say">${fill(st.say, null, n, true)}</p>` : ''}
      ${st.id === 'intro' ? noesHtml(st.noes, n, null, true) : ''}
      ${st.branches ? st.branches.map(([q, a]) => `<div class="obj"><b>${esc(q)}</b><span>${fill(a, null, n, true)}</span></div>`).join('') : ''}
      ${st.pitch ? `<h4>Когда вышли на главного</h4><p class="say">${fill(st.pitch, null, n, true)}</p>` : ''}
      ${extra || ''}
      ${st.id !== 'intro' ? noesHtml(st.noes, n, null, false) : ''}
      ${st.tips ? `<ul class="tips">${st.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    </section>`;
  }
  function specialPanel(n) {
    const li = (a, b) => `<li><b>${a}</b><span>${b}</span></li>`;
    if (n === '__hot') {
      return `<div class="s-top"><div class="s-head"><h2>Готовы сейчас: звонить первыми</h2><span class="s-goal">${SPECIAL[n].list().length} компаний</span></div>
        <ul class="s-short">
          ${li('Кто здесь', 'Компании, у которых одновременно есть нужда в сайте и признаки готовности платить: большой поток клиентов, филиалы, деньги уже уходят на соцсети, DIKIDI/YCLIENTS или агрегаторы, есть жалобы в отзывах.')}
          ${li('Подход', 'Короткое вступление и сразу к деньгам: «Вы уже платите [площадке] и ведёте соцсети — а своего сайта, куда это всё ведёт, нет».')}
          ${li('Что говорить', 'Сценарий — по нише компании (кнопка ниши выше). В карточке: «Почему сейчас» и «Подготовка к звонку» с её отзывами и расчётом.')}
          ${li('Срочность', 'Им сайт нужен сегодня: каждый месяц без него — потерянные клиенты и комиссии. Предлагайте запуск за [срок] и оплату частями.')}
        </ul></div>
        <details class="full"><summary>Как выбраны компании</summary><div class="s-body"><section>
          <p>Методика «нужда × готовность купить» из англоязычной практики продаж локальному бизнесу (NotiQ, 2026): просто «нет сайта» — это нужда, а готовность видна по активности бизнеса. Баллы:</p>
          <ul><li>300+ отзывов — 3, 100+ — 2, 40+ — 1 (живой спрос)</li><li>рейтинг 4.7+ — 1</li><li>несколько точек — 2 (бизнес растёт)</li>
          <li>2+ соцсети, Taplink или QR-меню — 2 (уже вкладываются в маркетинг)</li><li>DIKIDI, YCLIENTS, агрегаторы, Суточно, Flowwow — 2 (платят площадкам)</li>
          <li>жалобы в отзывах на цены, запись, дозвон и т. п. — 2</li><li>30%+ конкурентов в нише с сайтом — 1</li><li>новая компания — 2</li></ul>
          <p>В «Готовы сейчас» — компании с ${HOT_MIN}+ баллами и телефоном.</p></section></div></details>`;
    }
    return `<div class="s-top"><div class="s-head"><h2>Новые компании</h2><span class="s-goal">${SPECIAL[n].list().length} компаний</span></div>
      <ul class="s-short">
        ${li('Кто здесь', 'Компании с отметкой «Скоро открытие» в 2ГИС и самые свежие карточки 2ГИС с небольшим числом отзывов.')}
        ${li('Заход', '«Увидел, что вы [недавно открылись / открываетесь <дата>] — поздравляю! Звоню, потому что первые месяцы решают, наберёте ли вы базу клиентов».')}
        ${li('Боль', 'О новом месте никто не знает, сарафана ещё нет, отзывов мало. Люди ищут в Яндексе — и находят тех, кто работает давно и у кого есть сайт.')}
        ${li('Предлагаем', 'Сайт к открытию: акция для первых клиентов, цены, запись, как добраться. Подключаем к 2ГИС и Яндексу с первого дня.')}
        ${li('Срочность', 'Успеть к открытию или к первому сезону. Расчёт: сколько клиентов нужно, чтобы выйти в ноль, и сколько из них может дать сайт.')}
      </ul></div>
      <details class="full"><summary>Как отвечать новым компаниям на «нет»</summary><div class="s-body">
        <div class="obj"><b>«Сначала откроемся, потом подумаем»</b><span>Как раз к открытию сайт и нужен: первые клиенты ищут вас в интернете в первую неделю. Через полгода догонять конкурентов дороже.</span></div>
        <div class="obj"><b>«Денег сейчас нет — всё ушло на ремонт и оборудование»</b><span>Понимаю. Можно начать с одной страницы — цены, запись, адрес — и оплатить частями. Окупится с первых клиентов.</span></div>
        <div class="obj"><b>«Нам хватит соцсетей»</b><span>Соцсеть сначала надо раскрутить, а сайт находят в Яндексе сразу по запросу «[услуга] Норильск». Для нового места это самый быстрый поток.</span></div>
        <div class="obj"><b>«Клиенты придут по сарафану»</b><span>Сарафан работает, когда уже есть довольные клиенты. Сайт приводит первых — тех, кто запустит сарафан.</span></div>
      </div></details>`;
  }
  function renderScript() {
    const n = state.niche, ns = S.niches[n];
    if (SPECIAL[n]) { $('script').innerHTML = specialPanel(n); return; }
    if (!ns) {
      $('script').innerHTML = `<div class="s-top"><div class="s-head"><h2>Сценарии звонков</h2></div>
        <p style="margin:0">Выберите нишу выше: откроется короткий план звонка, разбор отзывов и полный сценарий по стрелке. В карточке каждой компании есть «Подготовка к звонку» с её отзывами и расчётом потерь.</p></div>`;
      return;
    }
    const np = nichePains(n);
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const labels = ['Представляемся', 'На главного', 'Проблемы', 'Отзывы', 'Расчёт и сумма'];

  const COMPLAINT = { call: 'до вас бывает трудно дозвониться', price: 'клиентам непонятны цены', book: 'неудобно записываться', info: 'вас непросто найти',

      <div class="c-side">
        <div class="score">${r.score}<small>балл</small></div>
        <label class="mark"><input type="checkbox" id="done-${r.i}" ${isDone ? 'checked' : ''}> обработано</label>
      </div>
    </article>`;
  }

  function render() {
    const base = filtered(true);
    const by = { '': base.length, A: 0, B: 0, C: 0 };
    base.forEach(x => by[x.p]++);
    document.querySelectorAll('#prio button').forEach(b => {
      b.querySelector('span').textContent = by[b.dataset.p];
      b.setAttribute('aria-pressed', b.dataset.p === state.prio);
    });
    const r = state.prio ? base.filter(x => x.p === state.prio) : base;
    $('count').textContent = `${r.length} из ${leads.filter(x => inView(x, state.niche)).length}`;
    $('list').innerHTML = r.length
      ? r.slice(0, state.shown).map((x, k, arr) => {
          const head = state.sort === 'score' && !state.prio && !SPECIAL[state.niche] && (k === 0 || arr[k - 1].p !== x.p)
            ? `<div class="grp ${x.p}">${GN[x.p]} — ${by[x.p]}</div>` : '';
          return head + card(x);
        }).join('') +
        (r.length > state.shown ? `<button class="more" id="more">Показать ещё ${Math.min(PAGE, r.length - state.shown)} (осталось ${r.length - state.shown})</button>` : '')
      : '<div class="empty">Ничего не найдено. Сбросьте фильтры или выберите другую нишу.</div>';
  }

  const toast = t => {
    let el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, 3500);
  };
  document.addEventListener('click', e => {
    const a = e.target.closest('a.msg-lk[data-msg]'); if (!a) return;
    const isMax = /max\.ru/.test(a.href);
    try {
      navigator.clipboard.writeText(a.dataset.msg).then(
        () => toast(isMax ? 'Сообщение скопировано — вставьте его в чат MAX' : 'Сообщение вставлено в чат и скопировано на всякий случай'),
        () => toast(isMax ? 'Скопируйте текст сообщения ниже и вставьте в чат' : 'Текст сообщения подставлен в чат'));
    } catch (err) { toast('Текст сообщения — в блоке ниже'); }
  });
  $('list').addEventListener('click', e => {
    const c = e.target.closest('[data-copy]');
    if (c) {
      const t = c.dataset.copy;
      const was = c.textContent, el = c.previousElementSibling || c.parentNode;
      const ok = () => { c.textContent = 'Скопировано'; setTimeout(() => c.textContent = was, 1400); };
      try { navigator.clipboard.writeText(t).then(ok, () => selectText(el)); } catch (err) { selectText(el); }
      return;
    }
    if (e.target.id === 'more') { state.shown += PAGE; render(); }
  });
  function selectText(el) { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(el.firstChild); s.removeAllRanges(); s.addRange(rg); }
  $('list').addEventListener('change', e => {
    if (!e.target.matches('.mark input')) return;
    const card = e.target.closest('.card'); const r = leads[+card.dataset.i];
    if (e.target.checked) done[key(r)] = 1; else delete done[key(r)];
    store.set(done); card.classList.toggle('done', e.target.checked);
  });

  let t; $('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; render(); }, 150); });
  $('district').addEventListener('change', e => { state.district = e.target.value; state.shown = PAGE; render(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
  const GN = { A: 'Горячие', B: 'Тёплые', C: 'Холодные' };
  $('prio').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.prio = b.dataset.p; state.shown = PAGE; render();
  });
  $('fToggle').addEventListener('click', () => {
    const open = !document.querySelector('.bar').classList.contains('open');
    document.querySelector('.bar').classList.toggle('open', open);
    $('fToggle').setAttribute('aria-expanded', open);
  });
  const updToggle = () => {
    const n = [state.district, state.prio, state.chat, state.hideDone, state.sort !== 'score'].filter(Boolean).length;
    $('fToggle').textContent = n ? `Фильтры · ${n}` : 'Фильтры';
  };
  document.querySelector('.bar').addEventListener('click', () => setTimeout(updToggle));
  document.querySelector('.bar').addEventListener('change', () => setTimeout(updToggle));
  window.addEventListener('scroll', () => { $('toTop').hidden = window.scrollY < 900; }, { passive: true });
  $('toTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  $('onlyChat').addEventListener('click', e => {
    state.chat = !state.chat; e.currentTarget.setAttribute('aria-pressed', state.chat); state.shown = PAGE; render();
  });
  $('hideDone').addEventListener('click', e => {
    state.hideDone = !state.hideDone; e.currentTarget.setAttribute('aria-pressed', state.hideDone); render();
  });

  $('foot').textContent = 'Сайтом не считаются соцсети, мессенджеры, Taplink, онлайн-запись (DIKIDI, YCLIENTS), Avito и QR-меню. Балл 0–100: ценность сайта для ниши, отзывы, рейтинг, активность в соцсетях, филиалы. Отметки «обработано» хранятся только в этом браузере.';
  fromHash();
})();
</script>
